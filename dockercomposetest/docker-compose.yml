services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  ollama-models:
    image: ollama/ollama:latest
    container_name: capex_model_setup
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$OLLAMA_MODEL\" && ollama pull nomic-embed-text"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui
    ports:
      - "${OPEN_WEBUI_BIND_ADDRESS:-127.0.0.1}:3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  capex-app:
    build: .
    container_name: capex_app
    ports:
      - "${CAPEX_BIND_ADDRESS:-127.0.0.1}:8501:8501"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./tests:/app/tests
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-300}
    depends_on:
      ollama-models:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama_data:
  open-webui_data: